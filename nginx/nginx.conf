server {
    listen 80;
    server_name julius-clinic.bnr.la;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name julius-clinic.bnr.la;

    ssl_certificate     /etc/letsencrypt/live/julius-clinic.bnr.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/julius-clinic.bnr.la/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Service worker and manifest must never be cached by the browser
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets can be cached forever
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
