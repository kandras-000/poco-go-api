services:
  postgres:
    image: postgres:16-alpine
    container_name: poco_postgres
    environment:
      POSTGRES_USER: poco
      POSTGRES_PASSWORD: poco_password
      POSTGRES_DB: poco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poco -d poco_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
